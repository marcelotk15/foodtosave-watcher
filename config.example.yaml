interval: 5m

# Path to the disk cache file.
# Allows the application to resume state after restarting.
# Default: ./cache.json
# In container: /app/data/cache.json (with volume mounted in /app/data)
cache_path: ./cache.json

gotify:
  server_url: https://gotify.example.com
  # Token da Application (Apps no WebUI), não o token do Client.
  app_token: seu-app-token

merchants:
  - id: "merchant-id-1"
    name: "Loja Centro"
  - id: "merchant-id-2"
    name: "Loja Bairro"
