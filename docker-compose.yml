services:
  gotify:
    image: gotify/server
    container_name: gotify
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      GOTIFY_DEFAULTUSER_PASS: admin
    volumes:
      - gotify-data:/app/data

  foodtosave-watcher:
    build: .
    container_name: foodtosave-watcher
    restart: unless-stopped
    depends_on:
      - gotify
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - foodtosave-data:/app/data
    environment:
      CONFIG_PATH: /app/config.yaml

volumes:
  foodtosave-data:
  gotify-data:
